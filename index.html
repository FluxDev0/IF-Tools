<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IF Tools</title>
    <link rel="stylesheet" href="style.css">
</head>
<body data-theme="dark" style="--test: none;">

    <div id="login-screen">
        <div class="login-box neuro-raised rounded">
            <h2>Willkommen!</h2>
            <p class="hint">Passwort eingeben:</p>
            <input class="neuro-inset" data-neuro="light_green" type="password" id="password-input" placeholder="Passwort..." onkeypress="handleEnter(event)">
            <button class="neuro-inset" data-neuro="red" onclick="loginAdmin()">Als Admin Einloggen</button>
            <button class="neuro-inset" data-neuro="red" onclick="hideLoginScreen()">Zurück</button>
            <p id="error-msg">Falsches Passwort!</p>
        </div>
    </div>

    <div id="app-layout">
        
        <div class="sidebar">
            <h2>🛠️ Informatik Tools</h2>
            <div data-btn="green" class="btn-1" onclick="show(`main-content`, `tree_generator`)">Entscheidungsbaum</div>
            <div data-btn="gray" class="btn-1 test" onclick="show(`main-content`, `multiplayer`)">Multiplayer Test</div>
            <div data-btn="gray" class="btn-1 test" onclick="show(`main-content`, `buttons`)">Buttons</div>
            <div data-btn="gray" class="btn-1 test" onclick="show(`main-content`, `settings`)">Settings</div>
            <div data-btn="gray" class="btn-1" onclick="showLoginScreen()">Admin Login</div>
            
            <div class="theme-switch">
                <button class="btn-1" data-neuro="light_green" onclick="toggleTheme()">🌓 Theme wechseln</button>
            </div>
        </div>

        <div id="main-content" class="main-content"></div>
    </div>

    <script src="security.js"></script>
    <script src="table.js"></script>
    <script src="apps.js"></script>
    <script src="tree.js"></script>
    <script src="script.js"></script>
</body>
</html>
